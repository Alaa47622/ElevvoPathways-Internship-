[project]
name = "samsum-qlora-mlops"
version = "0.1.0"
description = "QLoRA dialogue summarization with MLflow, FastAPI, Docker and CI"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "accelerate>=1.8,<2",
    "bitsandbytes>=0.46,<1",
    "datasets>=3.6,<5",
    "evaluate>=0.4.3,<1",
    "fastapi>=0.115,<1",
    "mlflow>=3.1,<4",
    "numpy>=1.26,<3",
    "peft>=0.15,<1",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
    "rouge-score>=0.1.2,<1",
    "safetensors>=0.5,<1",
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/peft_summarizer"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
