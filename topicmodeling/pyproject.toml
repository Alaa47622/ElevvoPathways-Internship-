[project]
name = "news-topic-modeling"
version = "0.1.0"
description = "Topic modeling on BBC news articles using LDA and NMF"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "gensim>=4.3.3,<5",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "nltk>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyldavis>=3.4.1,<4",
    "scikit-learn>=1.5,<2",
    "scipy>=1.13,<2",
    "wordcloud>=1.9,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topic_modeling"]
