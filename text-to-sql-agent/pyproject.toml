[project]
name = "autonomous-text-to-sql-agent"
version = "0.1.0"
description = "Autonomous Text-to-SQL agent with LangGraph, SQLite, self-correction and Streamlit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0.0",
  "langchain-core>=1.0.0",
  "langchain-openai>=1.0.0",
  "openai>=2.0.0",
  "python-dotenv>=1.0.1",
  "streamlit>=1.45.0",
  "pandas>=2.2.0",
  "matplotlib>=3.9.0",
]
[dependency-groups]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
